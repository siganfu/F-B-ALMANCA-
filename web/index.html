<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f3d">
<title>F&amp;B Deutsch Akademie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FB Deutsch">
<style>
:root{
  --navy:#0f1f3d; --navy-2:#1b3160; --gold:#c9a14a; --gold-2:#e6c97f; --gold-ink:#7a5b17;
  --bg:#f2f4f7; --card:#ffffff; --text:#14213d; --muted:#5b6880; --line:#e2e6ee; --chip:#eef1f6;
  --ok:#1d7f53; --ok-bg:#e2f3ea; --bad:#b83227; --bad-bg:#fbe8e6; --warn:#9a6512; --warn-bg:#fcf1dc;
  --hero:#0f1f3d; --hero-text:#ffffff;
  --shadow:0 1px 2px rgba(15,31,61,.06),0 4px 16px rgba(15,31,61,.07);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1122; --card:#131e36; --text:#e9edf5; --muted:#9ba7be; --line:#24345a; --chip:#1b2947;
    --ok:#4cc38a; --ok-bg:#12352a; --bad:#ff8a7a; --bad-bg:#3a1b1a; --warn:#f0bf5e; --warn-bg:#382a10;
    --hero:#0d1a35; --gold-ink:#e6c97f; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1122; --card:#131e36; --text:#e9edf5; --muted:#9ba7be; --line:#24345a; --chip:#1b2947;
  --ok:#4cc38a; --ok-bg:#12352a; --bad:#ff8a7a; --bad-bg:#3a1b1a; --warn:#f0bf5e; --warn-bg:#382a10;
  --hero:#0d1a35; --gold-ink:#e6c97f; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.topbar .back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--gold-2),var(--gold));color:var(--navy);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;flex:none}
.brand-t{min-width:0}
.brand-t b{display:block;font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t small{display:block;color:var(--gold-2);font-size:11.5px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-2);border:1.5px solid var(--gold);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--gold-2);flex:none}
main{padding:16px}
/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:500}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--navy)}
:root[data-theme="dark"] .nav a.on{color:var(--gold-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav a.on{color:var(--gold-2)}}
.nav a.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--gold);margin-top:2px}
/* Hero */
.hero{background:var(--hero);color:var(--hero-text);border-radius:20px;padding:20px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(201,161,74,.35)}
.hero::after{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(201,161,74,.25)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:23px;margin:2px 0 4px;position:relative}
.hero p{margin:0;color:#c8d1e4;font-size:14px;position:relative}
.hero .eyebrow{color:var(--gold-2);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.goal{margin-top:16px;position:relative}
.goal-row{display:flex;justify-content:space-between;font-size:13px;color:#c8d1e4;margin-bottom:6px}
.goal-row b{color:#fff}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:6px;transition:width .4s}
.bar.light{background:var(--chip)}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 10px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.stat span{font-size:11.5px;color:var(--muted)}
.stat .gold{color:var(--gold-ink)}
/* Buttons */
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .08s, background .15s}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-navy{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn-navy{background:var(--navy-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-navy{background:var(--navy-2)}}
.btn-ghost{background:var(--chip);color:var(--text)}
.btn-ok{background:var(--ok-bg);color:var(--ok)}
.btn-sm{min-height:38px;font-size:14px;padding:8px 12px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.cta{flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;min-height:80px}
.cta small{font-weight:500;font-size:12px;opacity:.8}
.cta .ico{font-size:20px}
/* Section */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec-h h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0}
.sec-h a{font-size:13px;color:var(--gold-ink);text-decoration:none;font-weight:600}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px}
/* Phrase of day */
.potd .de{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.3;margin:4px 0}
.potd .tr{color:var(--muted);font-size:14.5px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 16%,transparent);padding:3px 8px;border-radius:20px}
.tag.b{color:var(--ok);background:var(--ok-bg)}
.tag.o{color:var(--warn);background:var(--warn-bg)}
.tag.i{color:var(--bad);background:var(--bad-bg)}
/* Module grid */
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:6px;min-height:128px;position:relative}
.mod .num{font-size:11px;font-weight:700;color:var(--gold-ink);letter-spacing:.8px}
.mod .em{font-size:24px;line-height:1}
.mod b{font-size:14.5px;line-height:1.25;font-weight:600}
.mod .mini{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.mod .mini .bar{flex:1;height:5px}
/* Module detail */
.mod-head{display:flex;gap:14px;align-items:center}
.mod-head .em{font-size:34px;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--chip);flex:none}
.mod-head h1{font-family:var(--serif);font-size:21px;margin:0;line-height:1.2}
.mod-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin:16px 0 12px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px}
.prow .txt{flex:1;min-width:0;cursor:pointer}
.prow .de{font-weight:600;font-size:15.5px}
.prow .tr{color:var(--muted);font-size:13.5px}
.prow .chk{color:var(--ok);font-size:14px;margin-left:4px}
.play{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none;font-size:16px}
.play.on{background:var(--gold);color:var(--navy)}
:root[data-theme="dark"] .play{background:var(--navy-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .play{background:var(--navy-2)}}
/* Card */
.deck-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.deck-top .t{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck-top .count{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;flex:none}
.fcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y}
.fcard .top{background:var(--hero);color:#fff;padding:18px 18px 16px;position:relative}
.fcard .top .lbl{font-size:11px;color:var(--gold-2);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.fcard .top .de{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.28;margin:6px 0 2px;word-wrap:break-word}
.fcard .top .note{font-size:12.5px;color:var(--gold-2);margin-top:6px}
.fcard .body{padding:16px 18px 18px}
.field{margin-bottom:12px}
.field .k{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.field .v{font-size:16px}
.field .v.ok{font-style:italic;color:var(--text)}
.field .hint{font-size:11.5px;color:var(--muted)}
.audio-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.abtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border-radius:12px;background:var(--chip);font-size:12px;font-weight:600;min-height:64px}
.abtn .e{font-size:20px;line-height:1}
.abtn.primary{background:var(--navy);color:#fff}
.abtn.mic{background:var(--gold);color:var(--navy)}
.abtn.active{outline:2px solid var(--gold);outline-offset:1px}
.abtn.listening{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,161,74,.6)}70%{box-shadow:0 0 0 12px rgba(201,161,74,0)}100%{box-shadow:0 0 0 0 rgba(201,161,74,0)}}
.answer{background:var(--chip);border-radius:14px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:center}
.answer .de{font-weight:600}
.answer .tr{font-size:13.5px;color:var(--muted)}
.answer .play{width:38px;height:38px;font-size:14px}
.deck-nav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:12px}
/* Speech result */
.sres{margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--line)}
.sres .score{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.sres .said{font-size:13.5px;color:var(--muted);margin-top:8px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.w{padding:3px 9px;border-radius:8px;font-size:14.5px;font-weight:600}
.w.ok{background:var(--ok-bg);color:var(--ok)}
.w.miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}
.w.extra{background:var(--warn-bg);color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.disclaimer{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.4}
/* Service */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:0 14px}
.search input{flex:1;border:0;background:none;padding:13px 0;outline:none;font-size:16px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:20px;background:var(--card);font-size:13px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.chip.on{background:var(--navy);color:#fff}
.srow .act{display:flex;gap:6px;flex:none}
.show{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:15px}
/* Overlay */
.overlay{position:fixed;inset:0;z-index:60;background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 24px;text-align:center}
.overlay .big{font-family:var(--serif);font-size:clamp(28px,8vw,44px);font-weight:600;line-height:1.25}
.overlay .small{color:#c8d1e4;margin-top:16px;font-size:15px}
.overlay .ov-act{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.modal{position:fixed;inset:0;z-index:70;background:rgba(6,12,26,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{font-family:var(--serif);margin:0 0 4px;font-size:22px}
.sheet p{color:var(--muted);margin:0 0 14px;font-size:14px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--gold)}
/* Quiz */
.q-de{font-family:var(--serif);font-size:22px;font-weight:600;text-align:center;margin:8px 0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;font-size:15px;font-weight:500}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
/* Profile */
.plist-p{display:flex;flex-direction:column;gap:8px}
.pp{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.pp .avatar{background:var(--navy);color:var(--gold-2)}
.pp .meta{flex:1;min-width:0}
.pp .meta b{display:block}
.pp .meta small{color:var(--muted)}
.pp.on{outline:2px solid var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{font-size:14.5px}
.row .l small{display:block;color:var(--muted);font-size:12.5px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.diag{font-size:13px;line-height:1.6}
.diag .okc{color:var(--ok);font-weight:600}
.diag .badc{color:var(--bad);font-weight:600}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.allergen-box{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px;font-weight:500}
.fav{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:18px;color:var(--muted)}
.fav.on{color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent)}
.big-quick{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:16px 18px;border-radius:16px;background:var(--gold);color:var(--navy);text-decoration:none;box-shadow:var(--shadow)}
.big-quick .ic{font-size:28px}
.big-quick b{display:block;font-size:19px;letter-spacing:.6px}
.big-quick small{font-size:13px;font-weight:500;opacity:.85}
.big-quick .arr{margin-left:auto;font-size:24px}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 2px 2px}
.demo{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:6px;vertical-align:2px;font-family:var(--sans)}
.upd{position:fixed;left:16px;right:16px;top:calc(70px + env(safe-area-inset-top));z-index:95;max-width:528px;margin:0 auto;background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.muted{color:var(--muted)}
.mt{margin-top:12px}
.center{text-align:center}
@media (min-width:420px){ .mods{grid-template-columns:1fr 1fr} }
@media (max-width:350px){ .audio-row{grid-template-columns:1fr 1fr} .fcard .top .de{font-size:22px} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Ana menü"><div class="nav-in" id="nav"></div></nav>
<div id="layer"></div>

<script>
/* =========================================================
   F&B Deutsch Akademie — Ephesia Resort Hotel
   Tek dosyalık mobil web uygulaması. Android WebView içinde
   window.FBNative köprüsü varsa yerel TTS / konuşma tanıma
   kullanılır; yoksa Web Speech API devreye girer.
   ========================================================= */

/* ---------------- İÇERİK ----------------
   Her ifade: [seviye, Almanca, Türkçe, Türkçe okunuş, Örnek cevap (DE), Örnek cevap (TR), Not]
   seviye: b = Başlangıç, o = Orta, i = İleri                    */
const MODULES = [
 {id:1, em:'👋', title:'Karşılama ve Selamlama', yer:'Restoran / Bar / Havuz', desc:'İlk izlenim: selam, hoş geldiniz, kaç kişisiniz', p:[
  ['b','Guten Morgen!','Günaydın!','Guuten morgen!','Guten Morgen!','Günaydın!'],

/* ---------------- SES: TTS SAĞLAYICILARI ----------------
   Modüler yapı: bir sağlayıcı = {name, label, ready(), speak(text,rate,cb), stop()}

const CLOUD_TTS = {
  endpoint: '',   // Örn: 'https://ornek-sunucu/tts'  → POST {text, lang:'de-DE', rate} → audio/mpeg döner
  headers: {}
};

const NativeBridge = (window.FBNative && typeof window.FBNative.speak === 'function') ? window.FBNative : null;

const CloudTTS = {
  name:'cloud', label:'Bulut TTS', audio:null,
  ready(){ return !!CLOUD_TTS.endpoint; },
  speak(text, rate, cb){
    this.stop();
    fetch(CLOUD_TTS.endpoint, {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, CLOUD_TTS.headers), body:JSON.stringify({text, lang:'de-DE', rate})})
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.blob(); })
      .then(b => { this.audio = new Audio(URL.createObjectURL(b)); this.audio.playbackRate = 1; this.audio.onended = () => cb.end(); this.audio.onerror = () => cb.error('Ses dosyası oynatılamadı.'); cb.start(); return this.audio.play(); })
      .catch(e => cb.error('Bulut ses servisine ulaşılamadı.', true));
  },
  stop(){ if(this.audio){ this.audio.pause(); this.audio = null; } }
};
const NativeTTS = {
  name:'native', label:'Android yerel ses', cbs:{}, seq:0,
  ready(){ if(!NativeBridge) return false; try{ return NativeBridge.ttsStatus() === 'ready'; }catch(e){ return false; } },
  status(){ try{ return NativeBridge ? NativeBridge.ttsStatus() : 'none'; }catch(e){ return 'none'; } },
  speak(text, rate, cb){
    const id = 'u'+(++this.seq); this.cbs = {}; this.cbs[id] = cb;
    let ok = false; try{ ok = NativeBridge.speak(id, text, rate); }catch(e){}
    if(!ok){ delete this.cbs[id]; cb.error('Android ses motoru konuşamadı.', true); }
  },
  stop(){ try{ NativeBridge && NativeBridge.stop(); }catch(e){} Object.values(this.cbs).forEach(c => c.end()); this.cbs = {}; }

const WebTTS = {
  name:'web', label:'Tarayıcı sesi (Web Speech)', voice:null, voices:[],
  supported(){ return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; },
  ready(){ return this.supported(); },
  loadVoices(){
    if(!this.supported()) return;
    this.voices = speechSynthesis.getVoices() || [];
    const de = this.voices.filter(v => /^de([-_]|$)/i.test(v.lang));
    const score = v => (/de[-_]DE/i.test(v.lang)?10:0) + (/google|neural|natural|premium|enhanced|anna|petra|helena|katja/i.test(v.name)?5:0) + (v.localService?1:0);
    de.sort((a,b) => score(b)-score(a));
    this.voice = de[0] || null;
  },
  hasGerman(){ return !!this.voice; },
  speak(text, rate, cb){
    const s = window.speechSynthesis;
    s.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = rate; u.pitch = 1;
    if(this.voice) u.voice = this.voice;
    u.onstart = () => cb.start();
    u.onend = () => cb.end();
    u.onerror = e => { if(e.error === 'interrupted' || e.error === 'canceled') cb.end(); else cb.error('Tarayıcı sesi oynatamadı ('+e.error+').'); };
    // Bazı mobil tarayıcılarda cancel() sonrası kısa bekleme gerekir
    setTimeout(() => { s.speak(u); if(s.paused) s.resume(); }, 60);
  },
  stop(){ if(this.supported()) speechSynthesis.cancel(); }
};
if(WebTTS.supported()){ WebTTS.loadVoices(); try{ speechSynthesis.addEventListener('voiceschanged', () => WebTTS.loadVoices()); }catch(e){ speechSynthesis.onvoiceschanged = () => WebTTS.loadVoices(); } }

const Audio_ = {
  playingKey:null, warnedNoGerman:false,
  provider(){
    if(CloudTTS.ready()) return CloudTTS;
    if(NativeTTS.ready()) return NativeTTS;
    if(WebTTS.ready()) return WebTTS;
    return null;
  },
  play(text, slow, key){
    if(this.playingKey === key){ this.stop(); return; }
    this.stop();
    const prov = this.provider();
    if(!prov){
      if(NativeBridge && NativeTTS.status() === 'missing') return showVoiceHelp();
      return toast('Bu cihazda sesli okuma desteklenmiyor. Lütfen Chrome veya Safari\'nin güncel sürümünü kullanın.');
    }
    if(prov === WebTTS && !WebTTS.hasGerman() && !this.warnedNoGerman){
      this.warnedNoGerman = true;
      toast('Cihazda Almanca ses bulunamadı; varsayılan sesle okunuyor. Ayarlardan Almanca ses paketini yükleyebilirsiniz.', 5000);
    }
    const rate = slow ? DB.settings.slowRate : DB.settings.normalRate;
    this.playingKey = key; markPlaying();
    const self = this; let done = false;
    const finish = () => { if(done) return; done = true; if(self.playingKey === key){ self.playingKey = null; markPlaying(); } };
    prov.speak(text, rate, {
      start(){},
      end: finish,
      error(msg, fallback){
        finish();
        if(fallback && prov !== WebTTS && WebTTS.ready()){ self.playingKey = key; markPlaying(); done = false; WebTTS.speak(text, rate, {start(){}, end:finish, error:(m)=>{finish(); toast(m);}}); }
        else toast(msg);
      }
    });
    // Güvenlik: bazı motorlar 'end' olayını göndermez
    setTimeout(finish, Math.max(4000, text.length * 160 / rate));
  },
  stop(){ [CloudTTS, NativeTTS, WebTTS].forEach(p => { try{ p.stop(); }catch(e){} }); this.playingKey = null; markPlaying(); }
};
function markPlaying(){

/* ---------------- KONUŞMA TANIMA (STT) ---------------- */
const STT = {
  rec:null, busy:false, handlers:null,
  kind(){
    if(NativeBridge && typeof NativeBridge.startListening === 'function'){ try{ if(NativeBridge.sttAvailable()) return 'native'; }catch(e){} }
    if(window.SpeechRecognition || window.webkitSpeechRecognition) return 'web';
    return null;
  },
  start(h){
    const k = this.kind();
    if(!k) return h.error(unsupportedSttMsg());
    this.handlers = h; this.busy = true;
    if(k === 'native'){ try{ NativeBridge.startListening('de-DE'); }catch(e){ this.fail('Mikrofon başlatılamadı.'); } return; }
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new R(); this.rec = rec;
    rec.lang = 'de-DE'; rec.interimResults = false; rec.maxAlternatives = 3; rec.continuous = false;
    let got = false;
    rec.onstart = () => h.state && h.state('listening');
    rec.onspeechend = () => h.state && h.state('processing');
    rec.onresult = e => { got = true; const alts = []; const r = e.results[0]; for(let i=0;i<r.length;i++) alts.push(r[i].transcript); this.done(alts); };
    rec.onerror = e => {
      const m = {'not-allowed':'Mikrofon izni verilmedi. Tarayıcı ayarlarından mikrofona izin verin.','service-not-allowed':'Konuşma tanıma bu sayfada kullanılamıyor (HTTPS gerekir).','no-speech':'Ses algılanmadı. Mikrofona biraz daha yakın ve net konuşun.','audio-capture':'Mikrofon bulunamadı.','network':'Konuşma tanıma için internet bağlantısı gerekiyor.','language-not-supported':'Bu cihaz Almanca konuşma tanımayı desteklemiyor.'}[e.error] || ('Konuşma tanıma hatası: '+e.error);
      got = true; this.fail(m);
    };
    rec.onend = () => { if(!got) this.fail('Ses algılanmadı. Tekrar deneyin.'); };
    try{ rec.start(); }catch(e){ this.fail('Mikrofon başlatılamadı.'); }
  },
  stop(){ try{ if(this.rec) this.rec.stop(); if(NativeBridge && NativeBridge.stopListening) NativeBridge.stopListening(); }catch(e){} },
  done(alts){ const h = this.handlers; this.busy = false; this.handlers = null; this.rec = null; h && h.result(alts); },
  fail(msg){ const h = this.handlers; this.busy = false; this.handlers = null; this.rec = null; h && h.error(msg); }
};
window.__fbNative.onSttState = s => { STT.handlers && STT.handlers.state && STT.handlers.state(s); };
window.__fbNative.onSttResult = alts => { STT.done(Array.isArray(alts) ? alts : [String(alts)]); };
window.__fbNative.onSttError = (code, msg) => {
  const m = {'-1':'Mikrofon izni verilmedi. Uygulama ayarlarından mikrofona izin verin.','1':'Ağ zaman aşımı. İnternet bağlantınızı kontrol edin.','2':'Ağ hatası. Konuşma tanıma için internet gerekebilir.','3':'Ses kaydı hatası.','5':'Konuşma tanıma başlatılamadı.','6':'Ses algılanmadı. Tekrar deneyin.','7':'Söylediğiniz anlaşılamadı. Daha net ve yavaş tekrar deneyin.','8':'Konuşma tanıma meşgul, birkaç saniye sonra deneyin.','9':'Mikrofon izni yok.','12':'Cihazınız Almanca konuşma tanımayı desteklemiyor. Google uygulamasından Almanca dil paketini indirin.','13':'Almanca dil paketi eksik. Google ayarlarından indirin.'}[String(code)];
  STT.fail(m || msg || ('Konuşma tanıma hatası ('+code+')'));
};
function unsupportedSttMsg(){
  if(NativeBridge) return 'Bu cihazda konuşma tanıma servisi bulunamadı. Google uygulamasının yüklü ve güncel olduğundan emin olun.';
  return 'Bu tarayıcı konuşma tanımayı desteklemiyor. Android\'de Chrome, iPhone\'da Safari (iOS 14.5+) kullanın. Dinleme ve yavaş dinleme yine çalışır.';

/* ---------------- KARŞILAŞTIRMA ---------------- */
const NUMW = ['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn','zwanzig','einundzwanzig','zweiundzwanzig','dreiundzwanzig','vierundzwanzig'];
NUMW[30] = 'dreissig';
function normWord(w){ w = w.toLowerCase().replace(/ß/g,'ss').replace(/[^a-zäöü0-9]/g,''); if(/^\d+$/.test(w) && NUMW[+w]) return NUMW[+w]; return w; }
function splitNorm(s){ return s.replace(/[-–—:\/]/g,' ').split(/\s+/).map(normWord).filter(Boolean); }
function compare(target, spoken){
  const words = target.split(/\s+/).filter(Boolean);
  const t = []; const owner = [];
  words.forEach((w, wi) => splitNorm(w).forEach(x => { t.push(x); owner.push(wi); }));
  const s = splitNorm(spoken);
  const n = t.length, m = s.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = t[i] === s[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const tm = new Array(n).fill(false), sm = new Array(m).fill(false);
  let i=0, j=0; while(i<n && j<m){ if(t[i]===s[j]){ tm[i]=sm[j]=true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  const wordOk = words.map((w, wi) => { const idx = owner.map((o,k)=>o===wi?k:-1).filter(k=>k>=0); return idx.length===0 || idx.every(k => tm[k]); });
  const matched = tm.filter(Boolean).length;
  const score = n ? Math.round(matched / n * 100) : 0;
  const extras = s.filter((w, k) => !sm[k]);
  return {words, wordOk, extras, score, spoken};
}

let curIdx = 0;
function drawCard(i){
  curIdx = i; const x = deck.items[i]; const p = me(); const n = deck.items.length;

function goCard(i){ history.replaceState(null, '', deck.base + i); Audio_.stop(); STT.stop(); drawCard(i); window.scrollTo(0,0); }
function finishDeck(){ toast('Tebrikler! Bu seti tamamladınız. 👏'); location.hash = deck.done; }
function cardPlay(slow){ const x = deck.items[curIdx]; Audio_.play(x.de, slow, slow?'c-s':'c-n'); touch(x.id); }
function toggleLearned(){ const x = deck.items[curIdx]; const p = me(); setLearned(x.id, !p.learned[x.id]); drawCard(curIdx); if(p.learned[x.id]) toast('Harika! İfade öğrenildi olarak işaretlendi.'); }
function swipe(el, next, prev){
  if(!el) return; let sx = 0, sy = 0, t = 0;
  el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; t = Date.now(); }, {passive:true});
  el.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if(Date.now()-t < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){ dx < 0 ? next() : prev(); } }, {passive:true});
}
function cardSpeak(){
  const x = deck.items[curIdx]; const btn = $('#micBtn'); const box = $('#sres');
  if(STT.busy){ STT.stop(); return; }
  if(!STT.kind()){ box.innerHTML = `<div class="sres"><div class="notice" style="margin:0">🎤 ${esc(unsupportedSttMsg())}</div></div>`; return; }
  Audio_.stop();
  btn.classList.add('listening'); btn.innerHTML = '<span class="e">🎙️</span>Dinliyorum…';
  box.innerHTML = `<div class="sres center muted">Şimdi söyleyin: <b lang="de" style="color:var(--text)">${esc(x.de)}</b></div>`;
  const reset = () => { const b = $('#micBtn'); if(b){ b.classList.remove('listening'); b.innerHTML = '<span class="e">🎤</span>Konuş'; } };
  STT.start({
    state(s){ const b = $('#micBtn'); if(b && s === 'processing') b.innerHTML = '<span class="e">⏳</span>Analiz…'; },
    result(alts){
      reset(); if(deck.items[curIdx] !== x) return;
      let best = null; alts.forEach(a => { const r = compare(x.de, a); if(!best || r.score > best.score) best = r; });
      showResult(x, best);
    },
    error(msg){ reset(); const b = $('#sres'); if(b) b.innerHTML = `<div class="sres"><div class="notice" style="margin:0">${esc(msg)}</div><button class="btn btn-ghost btn-sm mt" onclick="cardSpeak()">🎤 Tekrar dene</button></div>`; }
  });
}
function showResult(x, r){
  const p = me(); touch(x.id);
  p.best[x.id] = Math.max(p.best[x.id]||0, r.score);
  let autoLearn = false; if(r.score >= 85 && !p.learned[x.id]){ p.learned[x.id] = today(); autoLearn = true; }
  save();
  const lvl = r.score >= 85 ? ['Harika! Çok iyi söylediniz.','var(--ok)','var(--ok-bg)'] : r.score >= 60 ? ['İyi! Küçük farklar var, bir kez daha deneyin.','var(--warn)','var(--warn-bg)'] : ['Tekrar deneyelim. Önce yavaş dinleyin.','var(--bad)','var(--bad-bg)'];
  const missing = r.words.filter((w,i) => !r.wordOk[i]);
  $('#sres').innerHTML = `
  <div class="sres">
    <div class="score"><div class="ring" style="background:${lvl[2]};color:${lvl[1]}">%${r.score}</div><div><b>${lvl[0]}</b>${autoLearn ? '<div class="muted" style="font-size:12.5px">✓ İfade öğrenildi olarak işaretlendi.</div>' : ''}</div></div>
    <div class="k" style="font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Hedef cümle</div>
    <div class="words" lang="de">${r.words.map((w,i) => `<span class="w ${r.wordOk[i]?'ok':'miss'}">${esc(w)}</span>`).join('')}</div>
    <div class="said">Algılanan: <span lang="de" style="color:var(--text)">“${esc(r.spoken)}”</span></div>
    ${r.extras.length ? `<div class="words">${r.extras.map(w => `<span class="w extra">${esc(w)}</span>`).join('')}</div>` : ''}
    ${missing.length ? `<div class="said">Eksik veya farklı söylenen: <b style="color:var(--bad)">${missing.map(esc).join(', ')}</b></div>` : ''}
    <div class="legend"><span><i style="background:var(--ok)"></i>Doğru</span><span><i style="background:var(--bad)"></i>Eksik / farklı</span><span><i style="background:var(--warn)"></i>Fazladan söylenen</span></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-gold btn-sm" onclick="cardSpeak()">🎤 Tekrar dene</button><button class="btn btn-ghost btn-sm" onclick="cardPlay(true)">🐢 Yavaş dinle</button></div>
    <div class="disclaimer">Not: Bu değerlendirme, konuşmanızın metne dönüştürülüp kelime kelime karşılaştırılmasıdır; gerçek fonetik telaffuz analizi değildir. Sistem anladıysa misafir de büyük ihtimalle anlayacaktır.</div>
  </div>`;
}

let svcFilter = 0, svcQuery = '';
function vService(){
  $('#view').innerHTML = `
    <div class="sec-h" style="margin-top:4px"><h2>🛎️ Hızlı Almanca</h2></div>
    <p class="muted" style="margin:-4px 2px 12px;font-size:13.5px">Türkçe yazın, Almancasını dinletin. Cümleye dokunursanız büyük ekranda misafire gösterebilirsiniz. İnternetsiz çalışır.</p>
    <label class="search">${ICONS.search}<input id="q" type="search" placeholder="Türkçe veya Almanca ara… (örn. su, alerji)" value="${esc(svcQuery)}" autocomplete="off"></label>
    <div class="chips">${[[0,'Tümü']].concat(MODULES.map(m=>[m.id, m.em+' '+m.title.split(' ').slice(0,2).join(' ')])).map(c => `<button class="chip ${svcFilter===c[0]?'on':''}" onclick="svcFilter=${c[0]};drawSvc(true)">${esc(c[1])}</button>`).join('')}</div>
    <div class="plist mt" id="svcList"></div>`;
  $('#q').addEventListener('input', e => { svcQuery = e.target.value; drawSvc(); });
  drawSvc();
}
function fold(s){ return s.toLocaleLowerCase('tr').replace(/[ıi̇]/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ç/g,'c').replace(/[öÖ]/g,'o').replace(/[üÜ]/g,'u').replace(/ä/g,'a').replace(/ß/g,'ss'); }
function drawSvc(chips){
  if(chips){ document.querySelectorAll('.chip').forEach((c,k) => c.classList.toggle('on', (k===0?0:MODULES[k-1].id) === svcFilter)); }
  const p = me();
  const q = fold(svcQuery.trim());
  const terms = q.split(/\s+/).filter(Boolean);
  let list = PHRASES.filter(x => (!svcFilter || x.mod === svcFilter) && (!terms.length || terms.every(t => fold(x.de+' '+x.tr+' '+x.ade+' '+x.atr+' '+x.ok).includes(t))));
  // Sıralama: favoriler → sık kullanılanlar → modül sırası
  const rank = x => (p.fav[x.id] ? 1000 : 0) + Math.min(p.use[x.id]||0, 999);
  list = list.map((x,k) => [x,k]).sort((a,b) => rank(b[0]) - rank(a[0]) || a[1] - b[1]).map(a => a[0]);
  const row = x => `
    <div class="prow srow">
      <div class="txt" onclick="showGuest('${x.id}')"><div class="de" lang="de">${esc(x.de)}</div><div class="tr">${esc(x.tr)}</div></div>
      <div class="act">
        <button class="fav ${p.fav[x.id]?'on':''}" aria-label="Favorilere ekle" onclick="toggleFav('${x.id}');drawSvc()">${p.fav[x.id]?'★':'☆'}</button>
        <button class="play" data-key="s-${x.id}" aria-label="Almanca dinle" onclick="Audio_.play(byId['${x.id}'].de,false,'s-${x.id}');bumpUse('${x.id}')">▶</button>
      </div>
    </div>`;
  let html = '';
  if(!list.length) html = '<div class="empty">Sonuç bulunamadı. Başka bir kelime deneyin (örn. "su", "masa", "alerji").</div>';
  else if(!terms.length && !svcFilter){
    const favs = list.filter(x => p.fav[x.id]); const freq = list.filter(x => !p.fav[x.id] && p.use[x.id]).slice(0,8);
    const rest = list.filter(x => !favs.includes(x) && !freq.includes(x));
    if(favs.length) html += '<div class="sub-h">★ Favorilerim</div>' + favs.map(row).join('');
    if(freq.length) html += '<div class="sub-h">Sık kullandıklarım</div>' + freq.map(row).join('');
    html += (favs.length||freq.length ? '<div class="sub-h">Tüm ifadeler</div>' : '') + rest.map(row).join('');
  } else html = list.map(row).join('');
  $('#svcList').innerHTML = html;
  markPlaying();
}

  const x = byId[id]; bumpUse(id);
  $('#layer').innerHTML = `<div class="overlay" role="dialog" aria-label="Misafire göster">
    <div class="tag" style="background:rgba(201,161,74,.2);color:var(--gold-2)">Für unseren Gast</div>

function startQuiz(){

    const wrong = shuffle(PHRASES.filter(y => y.id !== x.id && y.tr !== x.tr)).slice(0,3).map(y => y.tr);
    return {id:x.id, opts:shuffle([x.tr, ...wrong]), ans:x.tr, picked:null};
  });
  quiz = {qs, i:0, score:0, done:false, showText:Store.get('fbda.qtext',true)};
  drawQ(true);
}
function drawQ(autoplay){
  const q = quiz.qs[quiz.i]; const x = byId[q.id];
  $('#view').innerHTML = `
    <div class="deck-top"><span class="t">Dinle ve Anla Testi</span><span class="count">${quiz.i+1} / 10 · ✓ ${quiz.score}</span></div>
    <div class="bar light" style="height:5px;margin-bottom:12px"><i style="width:${(quiz.i+1)*10}%"></i></div>
    <div class="panel center">
      <button class="play" style="width:64px;height:64px;font-size:22px;margin:4px auto" data-key="qz" aria-label="Dinle" onclick="Audio_.play(byId['${x.id}'].de,false,'qz')">🔊</button>
      <div><button class="btn btn-ghost btn-sm" data-key="qz-s" onclick="Audio_.play(byId['${x.id}'].de,true,'qz-s')">🐢 Yavaş dinle</button></div>
      ${quiz.showText || q.picked ? `<div class="q-de" lang="de">${esc(x.de)}</div>` : '<div class="muted mt" style="font-size:13px">Cümleyi dinleyin…</div>'}
    </div>
    <div class="opts">${q.opts.map((o,k) => `<button class="opt ${q.picked!=null ? (o===q.ans?'right':(k===q.picked?'wrong':'')) : ''}" ${q.picked!=null?'disabled':''} onclick="pickQ(${k})">${esc(o)}</button>`).join('')}</div>
    ${q.picked!=null ? `<button class="btn btn-navy btn-block mt" onclick="nextQ()">${quiz.i<9?'Sonraki soru ›':'Sonucu gör'}</button>` : ''}`;
  if(autoplay) setTimeout(() => Audio_.play(x.de, false, 'qz'), 150);
}
function pickQ(k){ const q = quiz.qs[quiz.i]; if(q.picked!=null) return; q.picked = k; const ok = q.opts[k] === q.ans; if(ok) quiz.score++; touch(q.id); drawQ(); toast(ok ? '✓ Doğru!' : '✗ Doğru cevap: '+q.ans, 1800); }
function nextQ(){
  if(quiz.i < 9){ quiz.i++; drawQ(true); return; }
  quiz.done = true; const p = me(); p.quizBest = Math.max(p.quizBest||0, quiz.score); save(); vQuiz();
}

/* ---------------- PROFİL & AYARLAR ---------------- */
function vProfile(){
  const p = me(); const total = PHRASES.length;
  const prov = Audio_.provider();
  const sttK = STT.kind();
  $('#view').innerHTML = `
    <div class="sec-h" style="margin-top:4px"><h2>Personel Profili <span class="demo">YEREL</span></h2></div>
    <div class="plist-p">${DB.profiles.map(x => { const l = Object.keys(x.learned).length; return `
      <div class="pp ${x.id===p.id?'on':''}">
        <div class="avatar">${esc(initials(x.name))}</div>
        <div class="meta"><b>${esc(x.name)}</b><small>${esc(x.role||'')} · ${l}/${total} ifade · %${Math.round(l/total*100)}</small></div>
        ${x.id===p.id ? '<span class="tag b">Aktif</span>' : `<button class="btn btn-ghost btn-sm" onclick="switchProfile('${x.id}')">Geç</button>`}
      </div>`; }).join('')}</div>
    <button class="btn btn-ghost btn-block mt" onclick="showOnboarding(true)">＋ Yeni personel ekle</button>

    <div class="sec-h"><h2>Modül İlerlemesi</h2></div>
    <div class="panel">${MODULES.map(m => { const l = learnedCount(m.id), t = m.items.length; return `
      <div class="row"><span class="l" style="flex:1;min-width:0">${m.em} ${esc(m.title)}<span class="bar light" style="display:block;height:5px;margin-top:6px"><i style="width:${l/t*100}%"></i></span></span><b style="font-variant-numeric:tabular-nums;font-size:14px">${l}/${t}</b></div>`; }).join('')}</div>

    <div class="sec-h"><h2>Ayarlar</h2></div>
    <div class="panel">
      <div class="row"><span class="l">Günlük hedef<small>Her gün çalışılacak ifade sayısı</small></span>
        <div class="seg">${[5,10,15,20].map(g => `<button class="${(p.goal||10)===g?'on':''}" onclick="setGoal(${g})">${g}</button>`).join('')}</div></div>
      <div class="row"><span class="l">Yavaş dinleme hızı</span>
        <div class="seg">${[[0.5,'Çok yavaş'],[0.6,'Yavaş'],[0.75,'Orta']].map(r => `<button class="${DB.settings.slowRate===r[0]?'on':''}" onclick="DB.settings.slowRate=${r[0]};save();vProfileRe()">${r[1]}</button>`).join('')}</div></div>
      <div class="row"><span class="l">Tema</span>
        <div class="seg">${[['auto','Otomatik'],['light','Açık'],['dark','Koyu']].map(r => `<button class="${DB.settings.theme===r[0]?'on':''}" onclick="DB.settings.theme='${r[0]}';save();applyTheme();vProfileRe()">${r[1]}</button>`).join('')}</div></div>
    </div>

    <div class="sec-h"><h2>Ses ve Mikrofon Kontrolü</h2></div>
    <div class="panel diag">
      <div>Sesli okuma: ${prov ? `<span class="okc">✓ ${esc(prov.label)}</span>` : '<span class="badc">✗ Kullanılamıyor</span>'}</div>
      ${prov === WebTTS ? `<div>Almanca ses: ${WebTTS.hasGerman() ? `<span class="okc">✓ ${esc(WebTTS.voice.name)}</span>` : '<span class="badc">✗ Bulunamadı (varsayılan ses kullanılır)</span>'}</div>` : ''}
      ${NativeBridge ? `<div>Android ses motoru: <b>${esc({ready:'Hazır',missing:'Almanca ses paketi eksik',init:'Başlatılıyor…',error:'Hata'}[NativeTTS.status()]||NativeTTS.status())}</b></div>` : ''}
      <div>Konuşma tanıma: ${sttK ? `<span class="okc">✓ ${sttK==='native'?'Android yerel':'Tarayıcı (Web Speech)'}</span>` : '<span class="badc">✗ Desteklenmiyor</span>'}</div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-navy btn-sm" data-key="test" onclick="Audio_.play('Herzlich willkommen im Ephesia Resort Hotel!',false,'test')">🔊 Sesi test et</button>
        ${NativeBridge ? '<button class="btn btn-ghost btn-sm" onclick="showVoiceHelp()">Almanca ses paketi</button>' : ''}
      </div>
    </div>
    ${NativeBridge ? '' : `<div class="sec-h"><h2>Ana Ekrana Ekle</h2></div>
    <div class="panel" style="font-size:14px;line-height:1.55">
      ${installEvt ? '<button class="btn btn-gold btn-block" style="margin-bottom:12px" onclick="doInstall()">📲 Uygulamayı yükle</button>' : ''}
      <b>Android (Chrome):</b> Sağ üstteki ⋮ menüsü → <i>Ana ekrana ekle</i> veya <i>Uygulamayı yükle</i>.<br>
      <b>iPhone (Safari):</b> Alttaki Paylaş ⬆︎ butonu → <i>Ana Ekrana Ekle</i> → <i>Ekle</i>.<br>
      <span class="muted" style="font-size:12.5px">Yüklendikten sonra uygulama internetsiz de açılır.</span>
    </div>`}
    <p class="center muted" style="font-size:12px;margin-top:20px">F&amp;B Deutsch Akademie v1.0 · Ephesia Resort Hotel<br>İlerleme bu cihazda saklanır.</p>
    <button class="btn btn-ghost btn-block" style="color:var(--bad)" onclick="resetProfile()">Bu profilin ilerlemesini sıfırla</button>`;
}
function vProfileRe(){ if(route.name !== 'profile') return; $('#view').innerHTML=''; vProfile(); }
function setGoal(g){ me().goal = g; save(); vProfileRe(); }
function switchProfile(id){ DB.current = id; save(); toast('Profil değiştirildi.'); render(); }
let resetArmed = 0;
function resetProfile(){ if(Date.now() - resetArmed > 4000){ resetArmed = Date.now(); toast('Silmek için 4 saniye içinde tekrar basın. Tüm ilerleme silinecek.', 4000); return; } resetArmed = 0; const p = me(); p.learned = {}; p.best = {}; p.streak = 0; p.lastDay = null; p.studied = []; p.quizBest = 0; save(); vProfileRe(); toast('İlerleme sıfırlandı.'); }
function showVoiceHelp(){
  $('#layer').innerHTML = `<div class="modal" onclick="if(event.target===this)closeLayer()"><div class="sheet">
    <h2>Almanca ses paketi</h2>
    <p>Telefonunuzda Almanca seslendirme paketi yüklü değilse ifadeler okunamaz. Paketi bir kez indirmeniz yeterli.</p>
    <ol style="padding-left:18px;font-size:14px;line-height:1.6;margin:0 0 14px">
      <li>Aşağıdaki "Ses paketini yükle" butonuna basın.</li>
      <li>"Google Konuşma Hizmetleri" içinde <b>Deutsch (Deutschland)</b> seçip indirin.</li>
      <li>Uygulamaya geri dönüp 🔊 butonunu tekrar deneyin.</li>
    </ol>
    <button class="btn btn-gold btn-block" onclick="try{FBNative.installTtsData()}catch(e){}">Ses paketini yükle</button>
    <button class="btn btn-ghost btn-block mt" onclick="try{FBNative.openTtsSettings()}catch(e){}">Metin okuma ayarlarını aç</button>
    <button class="btn btn-ghost btn-block mt" onclick="closeLayer()">Kapat</button>
  </div></div>`;
}
function showOnboarding(adding){
  $('#layer').innerHTML = `<div class="modal"><div class="sheet">
    <div class="logo" style="width:48px;height:48px;font-size:20px;border-radius:13px;margin-bottom:12px">FB</div>
    <h2>${adding ? 'Yeni personel' : 'F&amp;B Deutsch Akademie'}</h2>
    <p>${adding ? 'Her personel kendi ilerlemesini ayrı takip eder.' : 'Almanca Öğren, Güvenle Servis Yap! Başlamak için adınızı ve görevinizi girin.'}</p>
    <input class="inp" id="obName" placeholder="Adınız Soyadınız" autocomplete="name" maxlength="40">
    <select class="inp" id="obRole">${ROLES.map(r => `<option>${r}</option>`).join('')}</select>
    <button class="btn btn-gold btn-block" onclick="finishOnboarding()">Başla</button>
    <p style="font-size:12px;margin:12px 0 0;color:var(--muted)"><span class="demo">DEMO</span> Bu sürümde giriş sistemi yok; profil ve ilerleme yalnızca bu telefonda saklanır. Davetli personel hesapları ve sunucu senkronizasyonu Aşama 2'de eklenecek.</p>
    ${adding ? '<button class="btn btn-ghost btn-block mt" onclick="closeLayer()">Vazgeç</button>' : ''}
  </div></div>`;
  setTimeout(() => { const i = $('#obName'); i && i.focus(); }, 100);
}
function finishOnboarding(){
  const n = ($('#obName').value || '').trim();
  if(n.length < 2){ toast('Lütfen adınızı yazın.'); return; }
  newProfile(n, $('#obRole').value); closeLayer();
  if(location.hash && location.hash !== '#/') location.hash = '#/'; else render();
  toast('Hoş geldiniz, '+n.split(' ')[0]+'! 🎉');
}

/* ---------------- PWA ---------------- */
let installEvt = null, wantReload = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(route.name === 'profile') vProfileRe(); });
function doInstall(){ if(!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; vProfileRe(); }); }
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !NativeBridge){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const offer = w => {
        if(document.querySelector('.upd')) return;
        const d = document.createElement('div'); d.className = 'upd';
        d.innerHTML = '<span style="flex:1">✨ Yeni sürüm hazır.</span><button class="btn btn-gold btn-sm">Güncelle</button><button class="btn btn-sm" style="color:#fff">Sonra</button>';
        d.children[1].onclick = () => { wantReload = true; w.postMessage('skipWaiting'); };
        d.children[2].onclick = () => d.remove();
        document.body.appendChild(d);
      };
      if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if(w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
      setInterval(() => reg.update().catch(()=>{}), 60*60*1000);
    }).catch(() => {});
    // Yalnızca kullanıcı "Güncelle"ye bastığında yenile (ilk kurulumda clients.claim() sayfayı yenilemesin)
    navigator.serviceWorker.addEventListener('controllerchange', () => { if(!wantReload) return; wantReload = false; location.reload(); });
  });
}

/* ---------------- BAŞLAT ---------------- */
applyTheme();
render();
</script>
